name: Crawl Reviews

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: Optional RSS or Atom override
        required: false
        default: ""
  schedule:
    - cron: "30 3,11,19 * * *"
      timezone: "Asia/Bangkok"

permissions:
  contents: read

concurrency:
  group: bytekora-crawler-reviews
  cancel-in-progress: false

jobs:
  crawl-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install article extractor
        run: python -m pip install --disable-pip-version-check trafilatura==2.2.0 google-genai pillow
      - name: Crawl and publish Reviews
        env:
          CATEGORY_SLUG: reviews
          CATEGORY_PROMPT_FILE: .github/prompts/reviews.txt
          CONTENT_TYPE_LOCK: review
          DYNAMIC_PRIMARY_CATEGORY: "true"
          FEED_URLS: >-
            ${{ inputs.feed_url || 'https://www.techradar.com/feeds/articletype/review,https://www.theverge.com/rss/reviews/index.xml,https://www.ign.com/rss/v2/articles/feed?categories=review,https://www.notebookcheck.net/RSS-Feed-Notebook-Reviews.8156.0.html' }}
          SOURCE_VERTICAL_RULES: "www.ign.com=games,ign.com=games"
          PUBLISHED_TODAY_ONLY: "true"
          CONTENT_TIMEZONE: Asia/Bangkok
          FEED_MAX_PAGES: "10"
          MAX_ARTICLES: "0"
          BYTEKORA_URL: ${{ secrets.BYTEKORA_URL }}
          INGEST_SECRET: ${{ secrets.BYTEKORA_INGEST_SECRET }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_BRANCH: ${{ vars.MEDIA_BRANCH || 'main' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python .github/scripts/crawl.py
