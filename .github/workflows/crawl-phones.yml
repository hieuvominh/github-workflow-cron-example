name: Crawl Phones

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: Optional RSS or Atom override
        required: false
        default: ""
  schedule:
    - cron: "0 5,13,21 * * *"
      timezone: "Asia/Bangkok"

permissions:
  contents: read

concurrency:
  group: bytekora-crawler-phones
  cancel-in-progress: false

jobs:
  crawl-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install article extractor
        run: python -m pip install --disable-pip-version-check trafilatura==2.2.0 google-genai pillow
      - name: Crawl and publish Phones
        env:
          CATEGORY_SLUG: phones
          FEED_URLS: >-
            ${{ inputs.feed_url || 'https://www.theverge.com/rss/phones/index.xml,https://9to5mac.com/feed/,https://www.androidcentral.com/feeds/all' }}
          PUBLISHED_TODAY_ONLY: "true"
          CONTENT_TIMEZONE: Asia/Bangkok
          FEED_MAX_PAGES: "10"
          MAX_ARTICLES: "0"
          BYTEKORA_URL: ${{ secrets.BYTEKORA_URL }}
          INGEST_SECRET: ${{ secrets.BYTEKORA_INGEST_SECRET }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_BRANCH: ${{ vars.MEDIA_BRANCH || 'main' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python .github/scripts/crawl.py
