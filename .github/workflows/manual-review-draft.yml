name: Manual Review Draft

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: HTTPS TechRadar review article URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bytekora-crawler-reviews
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Gemini key rotation
        uses: actions/cache/restore@v4
        with:
          path: |
            .gemini-key-index
            .gemini-model-preferences.json
          key: gemini-key-index-${{ github.run_id }}
          restore-keys: gemini-key-index-
      - name: Install article extractor
        run: python -m pip install --disable-pip-version-check trafilatura==2.2.0 google-genai pillow
      - name: Create review draft from URL
        env:
          MANUAL_ARTICLE_URL: ${{ inputs.article_url }}
          CATEGORY_SLUG: reviews
          CATEGORY_PROMPT_FILE: .github/prompts/reviews.txt
          CONTENT_TYPE_LOCK: review
          DYNAMIC_PRIMARY_CATEGORY: "true"
          BYTEKORA_URL: ${{ secrets.BYTEKORA_URL }}
          INGEST_SECRET: ${{ secrets.BYTEKORA_INGEST_SECRET }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_BRANCH: ${{ vars.MEDIA_BRANCH || 'main' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
          GEMINI_KEY_INDEX_FILE: .gemini-key-index
          GEMINI_MODEL_PREFERENCE_FILE: .gemini-model-preferences.json
        run: python .github/scripts/crawl.py
      - name: Save Gemini key rotation
        if: always() && hashFiles('.gemini-key-index', '.gemini-model-preferences.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .gemini-key-index
            .gemini-model-preferences.json
          key: gemini-key-index-${{ github.run_id }}
