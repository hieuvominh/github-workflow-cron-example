name: Computing Internal Link Trial (Draft Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bytekora-internal-link-computing-trial
  cancel-in-progress: false

jobs:
  create-computing-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore Computing link snapshot
        uses: actions/cache/restore@v4
        with:
          path: .internal-links-computing.json
          key: internal-links-computing-${{ github.run_id }}
          restore-keys: internal-links-computing-
      - name: Restore Gemini key rotation
        uses: actions/cache/restore@v4
        with:
          path: |
            .gemini-key-index
            .gemini-model-preferences.json
          key: gemini-key-index-${{ github.run_id }}
          restore-keys: gemini-key-index-
      - name: Install article extractor
        run: python -m pip install --disable-pip-version-check trafilatura==2.2.0 google-genai pillow
      - name: Create at most one Computing draft with internal links
        env:
          CATEGORY_SLUG: computing
          FEED_URLS: https://techcrunch.com/category/hardware/feed/,https://www.theverge.com/rss/laptops/index.xml,https://www.tomshardware.com/feeds/all
          PUBLISHED_WITHIN_HOURS: "36"
          FEED_MAX_PAGES: "1"
          MAX_ARTICLES: "10"
          DRAFT_ONLY: "true"
          INTERNAL_LINK_TRIAL: "true"
          INTERNAL_LINK_SNAPSHOT_FILE: .internal-links-computing.json
          BYTEKORA_URL: ${{ secrets.BYTEKORA_URL }}
          INGEST_SECRET: ${{ secrets.BYTEKORA_INGEST_SECRET }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_BRANCH: ${{ vars.MEDIA_BRANCH || 'main' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_FALLBACK_MODELS: gemini-3.5-flash-lite,gemini-3.1-flash-lite
          GEMINI_KEY_INDEX_FILE: .gemini-key-index
          GEMINI_MODEL_PREFERENCE_FILE: .gemini-model-preferences.json
        run: python .github/scripts/crawl.py
      - name: Save Computing link snapshot
        if: always() && hashFiles('.internal-links-computing.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .internal-links-computing.json
          key: internal-links-computing-${{ github.run_id }}
      - name: Save Gemini key rotation
        if: always() && hashFiles('.gemini-key-index', '.gemini-model-preferences.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .gemini-key-index
            .gemini-model-preferences.json
          key: gemini-key-index-${{ github.run_id }}
