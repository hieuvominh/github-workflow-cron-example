name: Crawl AI

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: Optional RSS or Atom override
        required: false
        default: ""
  schedule:
    - cron: "0 3,11,19 * * *"
      timezone: "Asia/Bangkok"

permissions:
  contents: read

concurrency:
  group: bytekora-crawler-ai
  cancel-in-progress: false

jobs:
  crawl-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Restore Gemini key rotation
        uses: actions/cache/restore@v4
        with:
          path: |
            .gemini-key-index
            .gemini-model-preferences.json
          key: gemini-key-index-${{ github.run_id }}
          restore-keys: gemini-key-index-
      - name: Install article extractor
        run: python -m pip install --disable-pip-version-check trafilatura==2.2.0 google-genai pillow
      - name: Crawl and publish AI
        env:
          CATEGORY_SLUG: ai
          FEED_URLS: >-
            ${{ inputs.feed_url || 'https://techcrunch.com/category/artificial-intelligence/feed/,https://www.theverge.com/rss/ai-artificial-intelligence/index.xml,https://www.geeky-gadgets.com/category/artificial-intelligence/feed/' }}
          PUBLISHED_WITHIN_HOURS: "36"
          FEED_MAX_PAGES: "10"
          MAX_ARTICLES: "0"
          BYTEKORA_URL: ${{ secrets.BYTEKORA_URL }}
          INGEST_SECRET: ${{ secrets.BYTEKORA_INGEST_SECRET }}
          MEDIA_REPO: ${{ vars.MEDIA_REPO }}
          MEDIA_BRANCH: ${{ vars.MEDIA_BRANCH || 'main' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_FALLBACK_MODEL: gemini-3.6-flash
          GEMINI_KEY_INDEX_FILE: .gemini-key-index
          GEMINI_MODEL_PREFERENCE_FILE: .gemini-model-preferences.json
        run: python .github/scripts/crawl.py
      - name: Save Gemini key rotation
        if: always() && hashFiles('.gemini-key-index', '.gemini-model-preferences.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .gemini-key-index
            .gemini-model-preferences.json
          key: gemini-key-index-${{ github.run_id }}
